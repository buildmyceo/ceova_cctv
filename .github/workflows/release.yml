name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm install

      # ── PRE-BUILD: Ensure Resource folders exist ──
      - name: Prepare Resource Folders
        shell: bash
        run: |
          mkdir -p ceova-desktop/src-tauri/resources

      # ── WINDOWS ONLY: Build Python backend into a standalone backend.exe ──
      - name: Build Python backend with PyInstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: cmd
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          pip install pyinstaller fastapi uvicorn opencv-python-headless requests pillow aiofiles python-multipart
          pyinstaller --onefile --name backend --distpath ceova-desktop\src-tauri\resources\ --exclude-module ultralytics --exclude-module torch --exclude-module torchvision --noconfirm ceova-desktop/python_backend/main.py
          echo "✅ backend.exe built successfully"
          dir ceova-desktop\src-tauri\resources

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Ceova Security v__VERSION__"
          releaseBody: "Automated production build of Ceova Security Terminal."
          releaseDraft: true
          prerelease: false
          includeRelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
