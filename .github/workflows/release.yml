name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm install

      # ── WINDOWS ONLY: Build Python backend into a standalone backend.exe ──
      - name: Build Python backend with PyInstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          pip install pyinstaller fastapi uvicorn opencv-python-headless requests ultralytics pillow
          pyinstaller `
            --onefile `
            --name backend `
            --distpath ceova-desktop/src-tauri/binaries/ `
            --hidden-import=ultralytics `
            --hidden-import=ultralytics.models `
            --hidden-import=ultralytics.models.yolo `
            --hidden-import=cv2 `
            --hidden-import=uvicorn `
            --hidden-import=fastapi `
            --hidden-import=starlette `
            --collect-data=ultralytics `
            --noconfirm `
            main.py
          Write-Host "✅ backend.exe built successfully"
          ls ceova-desktop/src-tauri/binaries/

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Ceova Security v__VERSION__"
          releaseBody: "Automated production build of Ceova Security Terminal."
          releaseDraft: true
          prerelease: false
          includeRelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
